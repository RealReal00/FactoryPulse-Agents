name: API tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-api.txt -r requirements-agent.txt
      - run: python -m pytest -q test_api.py test_machine_simulator.py test_analysis_agent.py
