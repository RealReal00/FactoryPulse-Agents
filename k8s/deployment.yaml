apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorypulse-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factorypulse-api
  template:
    metadata:
      labels:
        app: factorypulse-api
    spec:
      containers:
        - name: factorypulse-api
          image: factorypulse-api:logging-12c9e8a
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: factorypulse-config
                  key: LOG_LEVEL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
